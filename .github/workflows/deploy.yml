name: Deploy STEOS VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-steos-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Executar deploy na VPS Hostinger (ste01)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST"

      - name: Verificar aplicacao em producao
        run: |
          curl -fsS --retry 10 --retry-delay 5 https://steos.stesistemas.com/index.php/login >/dev/null
          echo "STEOS online e validado via HTTPS!"
